<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Calculator</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5; margin: 0; }
        .calc { background: #222; padding: 25px; border-radius: 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); width: 320px; }
        input { width: 100%; height: 70px; font-size: 32px; text-align: right; margin-bottom: 20px; border: none; padding: 15px; box-sizing: border-box; background: #eee; border-radius: 8px; color: #333; }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        button { padding: 20px; font-size: 22px; border: none; border-radius: 8px; cursor: pointer; background: #444; color: white; transition: 0.2s; }
        button:hover { background: #555; filter: brightness(1.2); }
        .op { background: #f39c12; } /* أزرار العمليات باللون البرتقالي */
        .equal { background: #27ae60; grid-column: span 2; } /* زر يساوي الأخضر */
        .clear { background: #c0392b; } /* زر المسح الأحمر */
    </style>
</head>
<body>
    <div class="calc">
        <input type="text" id="res" readonly>
        <div class="buttons">
            <button onclick="add('-')" class="op">-</button>
            <button onclick="add('*')" class="op">×</button>
            <button onclick="add('/')" class="op">÷</button>
            <button onclick="clearRes()" class="clear">C</button>
            
            <button onclick="add('+')" class="op">+</button>
            <button onclick="add('9')">9</button>
            <button onclick="add('8')">8</button>ٍ
            <button onclick="add('7')">7</button>
            
            <button style="visibility: hidden;"></button> <button onclick="add('6')">6</button>
            <button onclick="add('5')">5</button>
            <button onclick="add('4')">4</button>ٍ
            
            <button onclick="add('2')">2</button>
            <button onclick="add('1')">1</button>
            <button onclick="calculate()" class="equal">=</button>
            
            <button style="visibility: hidden;"></button> <button onclick="add('0')">0</button>
            <button onclick="add('3')">3</button>
        </div>
    </div>
    <script>
        let r = document.getElementById('res');
        function add(v) { r.value += v; }
        function clearRes() { r.value = ''; }
        function calculate() { try { r.value = eval(r.value); } catch { r.value = 'Error'; } }
    </script>
</body>
</html>ٍ
